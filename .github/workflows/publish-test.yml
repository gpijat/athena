name: Publish to TestPyPI (manual)

# Manual dry-run publish to https://test.pypi.org, so you can sanity-check a
# release (metadata, README rendering, install from index) before tagging a
# real release that goes to PyPI. Uses Trusted Publishing, same as publish.yml.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    # Separate GitHub Environment from `pypi` since this is a different
    # Trusted Publisher registration (test.pypi.org, not pypi.org). Create it
    # (Settings > Environments) or remove this line. See .github/PYPI_SETUP.md.
    environment: testpypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no API token needed.
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # With Trusted Publishing configured on TestPyPI, no `password` is
          # needed.
